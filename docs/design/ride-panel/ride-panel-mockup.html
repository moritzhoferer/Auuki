<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ride panel mockup (split view)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0e10}
a{color:#9ab4ff}a:hover{color:#c3d1ff}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
button{font-family:inherit}
</style>

</head><body>
<!-- Design mockup for the Auuki split-view ride panel. Static reference; mock data. -->
<template id="tpl"><div style="width: 1392px; height: 1040px; box-sizing: border-box; padding: 40px 48px; background: #0d0e10; font-family: Inter, system-ui, sans-serif; color: #f2f3f5; display: flex; gap: 48px; align-items: flex-start">
<sc-for list="{{panels}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 14px; width: 400px">
<div style="display: flex; align-items: baseline; gap: 10px; height: 24px">
<span style="font-size: 15px; font-weight: 700; color: #f2f3f5">{{p.caption}}</span>
<span style="font-size: 13px; color: #a3a9b3">{{p.sub}}</span>
</div>

<section aria-label="Ride panel" style="width: 400px; height: 880px; box-sizing: border-box; background: #17181b; border-radius: 14px; border: 1px solid #2a2d33; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #2a2d33; font-size: 12px; color: #a3a9b3">
<div style="display: flex; align-items: center; gap: 6px">
<svg role="img" aria-label="Smart trainer connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e6e8eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Smart trainer connected</title><circle cx="8" cy="9" r="5.5"></circle><circle cx="8" cy="9" r="1"></circle><path d="M8 9h7"></path><rect x="15" y="6" width="6" height="6" rx="1.5"></rect><path d="M8 9L4 21M8 9l4 12M2 21h20M18 12v9"></path></svg>
<svg role="img" aria-label="Heart rate monitor connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e6e8eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Heart rate monitor connected</title><path d="M12 20s-8-4.6-8-10.5A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.5C20 15.4 12 20 12 20z"></path><path d="M7 12h2.5l1.5-2.5 2 5 1.5-2.5H17"></path></svg>
<svg role="img" aria-label="Power meter not connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Power meter not connected</title><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
<svg role="img" aria-label="Speed/cadence sensor not connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Speed/cadence sensor not connected</title><circle cx="10" cy="10" r="6"></circle><circle cx="10" cy="10" r="1.5"></circle><path d="M10 10l6 9M14 19h5"></path></svg>
<svg role="img" aria-label="Muscle oxygen sensor not connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Muscle oxygen (SmO2) sensor not connected</title><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg>
<svg role="img" aria-label="Core temperature sensor not connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Core temperature sensor not connected</title><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"></path><path d="M12 9v8"></path></svg>
<svg role="img" aria-label="Bike controller not connected" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Bike controller not connected</title><rect x="3" y="8" width="18" height="8" rx="4"></rect><circle cx="8" cy="12" r="1.2"></circle><circle cx="16" cy="12" r="1.2"></circle></svg>
</div>
<span style="font-weight: 600; color: #d6d9de">Sweet spot 3×20′</span>
</header>

<div style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #c9cdd3">EFFORT 2 / 3</span>
<span class="num" style="font-size: 13px; color: #a3a9b3">{{p.intElapsed}} / 20:00</span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span class="num" style="font-size: 60px; line-height: 1; font-weight: 800; color: {{p.clockColor}}">{{p.intLeft}}</span>
<span style="font-size: 15px; font-weight: 600; color: #a3a9b3">left</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #2a2d33; overflow: hidden">
<div style="height: 6px; width: {{p.intPct}}%; background: #d6d9de"></div>
</div>
</div>

<div style="margin: 4px 12px 0; padding: 14px 14px 10px; border-radius: 12px; border: 2px solid {{p.st.c}}; background: {{p.st.bg}}; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em; color: {{p.st.c}}">{{p.st.arrow}} {{p.st.label}}</span>
<span class="num" style="font-size: 13px; font-weight: 600; color: {{p.st.c}}">{{p.st.hint}}</span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 8px">
<span class="num" style="font-size: 96px; line-height: 0.95; font-weight: 800; color: {{p.st.c}}">{{p.p3}}</span>
<span style="font-size: 14px; color: #c9cdd3">W · 3 s</span>
</div>
</div>

<div role="img" aria-label="Power gauge: target band with current 3 second power and interval average" style="position: relative; height: 76px; margin-top: 4px">
<div style="position: absolute; left: 0; right: 0; top: 28px; height: 26px; display: flex; border-radius: 6px; overflow: hidden">
<div style="flex: {{zr}} 1 0px; background: rgba(255,93,82,0.38)"></div>
<div style="flex: {{za}} 1 0px; background: rgba(246,183,60,0.45)"></div>
<div style="flex: {{zg}} 1 0px; background: rgba(63,211,127,0.70)"></div>
<div style="flex: {{za}} 1 0px; background: rgba(246,183,60,0.45)"></div>
<div style="flex: {{zr}} 1 0px; background: rgba(255,93,82,0.38)"></div>
</div>
<div style="position: absolute; top: 21px; left: {{loPos}}%; width: 2px; height: 37px; margin-left: -1px; background: #f2f3f5"></div>
<div style="position: absolute; top: 21px; left: {{hiPos}}%; width: 2px; height: 37px; margin-left: -1px; background: #f2f3f5"></div>
<div style="position: absolute; top: 22px; left: {{p.m3}}%; width: 6px; height: 40px; margin-left: -3px; border-radius: 3px; background: #ffffff; box-shadow: 0 0 0 2px #17181b"></div>
<div style="position: absolute; top: 60px; left: {{p.mAvg}}%; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); background: {{p.avgSt.c}}; box-shadow: 0 0 0 2px #17181b"></div>
<span class="num" style="position: absolute; top: 0px; left: {{loPos}}%; transform: translateX(-50%); font-size: 18px; line-height: 20px; font-weight: 700; color: #f2f3f5">{{lo}}</span>
<span class="num" style="position: absolute; top: 0px; left: {{hiPos}}%; transform: translateX(-50%); font-size: 18px; line-height: 20px; font-weight: 700; color: #f2f3f5">{{hi}}</span>
</div>
<div style="display: flex; justify-content: center; gap: 16px; font-size: 11px; color: #a3a9b3">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 4px; height: 12px; background: #fff; border-radius: 2px"></span>3 s power</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; transform: rotate(45deg); background: {{p.avgSt.c}}"></span>interval avg</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px 12px 0">
<div style="background: #212328; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #a3a9b3">INTERVAL AVG</span>
<span class="num" style="font-size: 28px; font-weight: 700; color: {{p.avgSt.c}}">{{p.avg}}</span>
</div>
<div style="background: #212328; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #a3a9b3">IN RANGE</span>
<span class="num" style="font-size: 28px; font-weight: 700; color: #f2f3f5">{{p.tir}}%</span>
</div>
</div>

<div style="margin: 12px 12px 0; border-radius: 10px; background: #212328; border: 2px solid {{p.nextBorder}}; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #a3a9b3">UP NEXT</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 17px; font-weight: 700">Recovery · 5:00</span>
<span class="num" style="font-size: 17px; font-weight: 700; color: #9ab4ff">{{recW}} W</span>
</div>
</div>

<div style="padding: 12px 12px 0">
<div role="img" aria-label="Workout profile with recorded power and current position" style="position: relative; height: 64px; border-radius: 8px; background: #1d1f23; overflow: hidden">
<sc-for list="{{p.segs}}" as="s" hint-placeholder-count="10">
<div style="position: absolute; bottom: 0; left: {{s.left}}%; width: {{s.width}}%; height: {{s.h}}px; box-sizing: border-box; border-left: 1px solid #1d1f23; border-right: 1px solid #1d1f23; background: #343840; overflow: hidden"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{s.fill}}%; background: #8a94a6"></div></div>
</sc-for>
<svg viewBox="0 0 376 64" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 64px"><polyline points="{{p.line}}" fill="none" stroke="#9ab4ff" stroke-width="1.5" stroke-linejoin="round"></polyline></svg>
<div style="position: absolute; top: 0; bottom: 0; left: {{p.posPct}}%; width: 2px; margin-left: -1px; background: #f2f3f5"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #a3a9b3; padding-top: 4px">
<span class="num">{{p.totalElapsed}} elapsed</span>
<span class="num">{{p.totalLeft}} left</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 12px 0">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #a3a9b3">HEART RATE</span>
<span class="num" style="font-size: 22px; font-weight: 700">{{p.hr}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #a3a9b3">CADENCE</span>
<span class="num" style="font-size: 22px; font-weight: 700">{{p.cad}}</span>
</div>
</div>

<div style="margin-top: auto; border-top: 1px solid #2a2d33; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px">
<div style="display: flex; flex: 1 1 0px; background: #212328; border-radius: 10px; padding: 3px">
<button type="button" aria-pressed="false" style="flex: 1 1 0px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #a3a9b3; font-size: 12px; font-weight: 700">ERG</button>
<button type="button" aria-pressed="false" style="flex: 1 1 0px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #a3a9b3; font-size: 12px; font-weight: 700">RES</button>
<button type="button" aria-pressed="true" style="flex: 1 1 0px; height: 40px; border: 0; border-radius: 8px; background: #3a3e46; color: #f2f3f5; font-size: 12px; font-weight: 700">SLOPE</button>
</div>
<button type="button" aria-label="Pause" style="width: 46px; height: 46px; border: 0; border-radius: 10px; background: #212328; color: #f2f3f5; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>
</button>
<button type="button" aria-label="Skip to next interval" style="width: 46px; height: 46px; border: 0; border-radius: 10px; background: #212328; color: #f2f3f5; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5l9 7-9 7z"></path><path d="M19 5v14"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Decrease slope" style="width: 64px; height: 46px; border: 0; border-radius: 10px; background: #212328; color: #f2f3f5; font-size: 22px; font-weight: 600">−</button>
<div style="flex: 1 1 0px; height: 46px; border-radius: 10px; background: #f2f3f5; color: #17181b; display: flex; align-items: center; justify-content: center; gap: 6px">
<span class="num" style="font-size: 22px; font-weight: 800">{{p.slope}}</span><span style="font-size: 15px; font-weight: 700">%</span>
</div>
<button type="button" aria-label="Increase slope" style="width: 64px; height: 46px; border: 0; border-radius: 10px; background: #212328; color: #f2f3f5; font-size: 22px; font-weight: 600">+</button>
</div>
</div>

</section>
</div>
</sc-for>
</div></template>
<div id="root"></div>
<script>
class DCLogic { constructor(p){ this.props=p; } }

class Component extends DCLogic {
  renderVals() {
    const ftp = this.props.ftp ?? 280;
    const tolPct = this.props.tolerance ?? 5;
    const W = (f) => Math.round(ftp * f);
    const lo = W(0.88), hi = W(0.94), tol = Math.max(1, Math.round(ftp * tolPct / 100));
    const dmin = lo - 3 * tol, dmax = hi + 3 * tol;
    // zoomed, piecewise-linear gauge: red 15 | amber 15 | green 40 | amber 15 | red 15 (% of width)
    const ZONES = [[dmin, 0], [lo - tol, 15], [lo, 30], [hi, 70], [hi + tol, 85], [dmax, 100]];
    const pos = (v) => {
      if (v <= dmin) return 0;
      if (v >= dmax) return 100;
      for (let i = 1; i < ZONES.length; i++) {
        const [w0, p0] = ZONES[i - 1], [w1, p1] = ZONES[i];
        if (v <= w1) return p0 + (v - w0) / (w1 - w0) * (p1 - p0);
      }
      return 100;
    };
    const pad = (n) => String(n).padStart(2, '0');
    const clock = (s) => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
    const hms = (s) => { s = Math.round(s); return Math.floor(s / 3600) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
    const COL = {
      in: { c: '#3fd37f', bg: 'rgba(63,211,127,0.10)' },
      near: { c: '#f6b73c', bg: 'rgba(246,183,60,0.10)' },
      out: { c: '#ff5d52', bg: 'rgba(255,93,82,0.13)' },
    };
    const judge = (v) => {
      if (v >= lo && v <= hi) return { ...COL.in, k: 'in', label: 'IN RANGE', hint: 'hold it', arrow: '●' };
      const above = v > hi;
      const d = above ? v - hi : lo - v;
      const k = d <= tol ? 'near' : 'out';
      const label = above ? (k === 'near' ? 'SLIGHTLY HIGH' : 'TOO HIGH') : (k === 'near' ? 'SLIGHTLY LOW' : 'TOO LOW');
      return { ...COL[k], k, label, hint: above ? 'ease off' : 'push', arrow: above ? '▲' : '▼' };
    };
    // minutes, low %FTP, high %FTP
    const plan = [[2.5,.50,.50],[2.5,.60,.60],[2.5,.70,.70],[2.5,.75,.75],[20,.88,.94],[5,.50,.50],[20,.88,.94],[5,.50,.50],[20,.88,.94],[10,.45,.45]];
    const total = plan.reduce((a, s) => a + s[0], 0) * 60;
    const curStart = 35 * 60, curDur = 20 * 60;
    const scen = [
      { caption: 'A · In range', sub: 'steady, mid-interval', left: 462, p3: .915, p10: .905, avg: .897, tir: 88, hr: 152, cad: 91, slope: '1.0' },
      { caption: 'B · Too high', sub: 'surging after a shift', left: 665, p3: 1.015, p10: .995, avg: .918, tir: 74, hr: 158, cad: 96, slope: '1.5' },
      { caption: 'C · Change in 4 s', sub: 'slightly low, recovery ahead', left: 4, p3: .862, p10: .873, avg: .902, tir: 91, hr: 155, cad: 88, slope: '1.0' },
    ];
    const panels = scen.map((s) => {
      const el = curDur - s.left;
      const tEl = curStart + el;
      const p3 = W(s.p3), p10 = W(s.p10), avg = W(s.avg);
      const st = judge(p3);
      const ending = s.left <= 5; // alert only in the last 5 s
      let t = 0;
      const segs = plan.map((g) => {
        const start = t * 60, end = (t + g[0]) * 60; t += g[0];
        // progress fill: ridden part light, remaining part dark (current block split at "now")
        const fill = Math.max(0, Math.min(100, (tEl - start) / (end - start) * 100)).toFixed(1);
        return { left: (start / total * 100).toFixed(2), width: (g[0] * 60 / total * 100).toFixed(2), h: Math.round(g[2] / 1.05 * 60), fill };
      });
      // synthetic recorded power (mock data), sampled every 10 s up to now
      const pts = [];
      for (let x = 0; x <= tEl; x += 10) {
        let acc = 0, g = plan[plan.length - 1];
        for (const seg of plan) { if (x < (acc + seg[0]) * 60) { g = seg; break; } acc += seg[0]; }
        let f = (g[1] + g[2]) / 2 + 0.025 * Math.sin(x / 37) + 0.018 * Math.sin(x / 11 + 1.3) + 0.01 * Math.sin(x / 4.7);
        if (tEl - x < 40) { const w = 1 - (tEl - x) / 40; f = f * (1 - w) + s.p3 * w; }
        pts.push((x / total * 376).toFixed(1) + ',' + Math.max(1, 64 - f / 1.05 * 60).toFixed(1));
      }
      return {
        line: pts.join(' '),
        caption: s.caption, sub: s.sub,
        totalLeft: hms(total - tEl), totalElapsed: hms(tEl),
        intLeft: clock(s.left), intElapsed: clock(el), intPct: (el / curDur * 100).toFixed(1),
        clockColor: ending ? '#f6b73c' : '#f2f3f5',
        p3, p10, avg, tir: s.tir, hr: s.hr, cad: s.cad, slope: s.slope,
        st, p10St: judge(p10), avgSt: judge(avg),
        m3: pos(p3).toFixed(1), mAvg: pos(avg).toFixed(1),
        posPct: (tEl / total * 100).toFixed(2), segs,
        nextBorder: ending ? '#f6b73c' : '#212328',
      };
    });
    return {
      panels, lo, hi, recW: W(0.50),
      zr: 15, za: 15, zg: 40,
      loPos: pos(lo).toFixed(1), hiPos: pos(hi).toFixed(1),
    };
  }
}

const vals = new Component({"ftp": 280, "tolerance": 7}).renderVals();
const get = (scope, path) => path.trim().split('.').reduce((o,k)=>o==null?o:o[k], scope);
const fill = (s, scope) => s.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = get(scope, p); return v == null ? '' : v; });
function render(node, scope) {
  const out = [];
  for (const n of [...node.childNodes]) {
    if (n.nodeType === 3) { out.push(document.createTextNode(fill(n.textContent, scope))); continue; }
    if (n.nodeType !== 1) continue;
    if (n.tagName.toLowerCase() === 'sc-for') {
      const list = get(scope, n.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = n.getAttribute('as');
      list.forEach((item, i) => out.push(...render(n, {...scope, [as]: item, $index: i})));
      continue;
    }
    const el = document.createElementNS(n.namespaceURI, n.tagName.toLowerCase());
    for (const a of n.attributes) el.setAttribute(a.name, fill(a.value, scope));
    render(n, scope).forEach(c => el.appendChild(c));
    out.push(el);
  }
  return out;
}
render(document.getElementById('tpl').content, vals).forEach(c => document.getElementById('root').appendChild(c));
</script></body></html>
