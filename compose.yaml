# docker compose up -d --build   ->  http://localhost:8080
#
# localhost is a secure context, so Web Bluetooth works there without TLS.
# Other devices on the home network need https for Web Bluetooth: enable the
# `https` profile (Caddy + DuckDNS certificate, see .env.example and server/README.md).
services:
  auuki:
    build: .
    image: auuki-home
    restart: unless-stopped
    ports:
      - "${AUUKI_BIND:-127.0.0.1}:8080:8080"
    env_file:
      - path: server/.env
        required: false
    environment:
      # trust X-Forwarded-Proto from Caddy, so the session cookie is https only
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - auuki-data:/data          # riders, their Garmin tokens and rides

  caddy:
    profiles: [https]
    build: ./caddy
    image: auuki-caddy
    restart: unless-stopped
    depends_on: [auuki]
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      AUUKI_HOST: ${AUUKI_HOST:-}
      DUCKDNS_API_TOKEN: ${DUCKDNS_API_TOKEN:-}
    volumes:
      - caddy-data:/data          # certificates and ACME account
      - caddy-config:/config

volumes:
  auuki-data:
  caddy-data:
  caddy-config:
