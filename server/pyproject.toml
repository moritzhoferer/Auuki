[project]
name = "auuki-home-server"
version = "0.1.0"
description = "Self-hosted API for Auuki: Intervals.icu workouts and uploads, Garmin upload"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-multipart==0.0.34",
    "garminconnect==0.3.20",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false
